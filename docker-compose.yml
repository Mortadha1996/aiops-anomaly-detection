services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports: ["5000:5000"]
    volumes: [mlflowdata:/mlflow]

volumes:
  pgdata:
  mlflowdata:
